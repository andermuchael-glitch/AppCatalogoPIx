<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Pix - Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🛍️ Catálogo Pix</h1>
            <nav>
                <button onclick="mostrarProdutos()" class="active">Produtos</button>
                <button onclick="mostrarClientes()">Clientes</button>
                <button onclick="mostrarPedidos()">Pedidos</button>
            </nav>
        </div>
    </header>
    <main class="container">
        <section id="section-produtos">
            <div class="section-header">
                <h2>📦 Produtos</h2>
                <button onclick="abrirFormProduto()" class="btn-primary">+ Novo Produto</button>
            </div>
            <div id="lista-produtos" class="grid-produtos"></div>
        </section>
        <section id="section-clientes" style="display:none;">
            <div class="section-header">
                <h2>👤 Clientes</h2>
                <button onclick="abrirFormCliente()" class="btn-primary">+ Novo Cliente</button>
            </div>
            <div id="lista-clientes" class="grid-clientes"></div>
        </section>
        <section id="section-pedidos" style="display:none;">
            <div class="section-header"><h2>📋 Pedidos</h2></div>
            <div id="lista-pedidos" class="grid-pedidos"></div>
        </section>
    </main>
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>
    <div id="modal-pix" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModalPix()">&times;</span>
            <div id="modal-pix-body"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
